{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Demo{% endblock %} — Abdulhaq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'portfolio/css/demo.css' %}">
</head>
<body class="demo-body">

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div class="demo-banner">
    <a href="{% url 'portfolio:index' %}" class="demo-back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Portfolioga qaytish
    </a>
    <span class="demo-badge">{% block demo_label %}Live demo{% endblock %}</span>
  </div>

  {% block content %}{% endblock %}

  <footer class="demo-footer">
    <div class="demo-container">
      <p>Bu sahifa Django bilan yaratilgan ishlaydigan demo &mdash; <strong>Abdulhaq</strong></p>
      <a href="{% url 'portfolio:index' %}#contact" class="btn btn-primary btn-sm">Bog'lanish</a>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
